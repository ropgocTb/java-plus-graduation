server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        - id: subscription-service-route
          uri: lb://subscription-service
          predicates:
            - Path=/subscriptions/**, /users/*/subscriptions/**, /users/*/subscriptions/*

        - id: categories-service-route
          uri: lb://main-service
          predicates:
            - Path=/admin/categories/**, /categories/**

        - id: request-service-route
          uri: lb://main-service
          predicates:
            - Path=/users/*/requests/**, /users/*/events/*/requests/**, /users/events/*/requests/count, /users/events/requests/count

        - id: event-service-route
          uri: lb://main-service
          predicates:
            - Path=/users/*/events/**, /admin/events/**, /admin/compilations/**, /compilations/**, /events/**, /internal/events/**

        - id: user-service-route
          uri: lb://user-service
          predicates:
            - Path=/users/**,/admin/users/**

        - id: stats-server
          uri: lb://stats-server
          predicates:
            - Path=/hit,/stats